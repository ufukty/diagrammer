<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="description" content="">
    <link rel="stylesheet" href="sequence.css">
  </head>

  <body>
    <div class="sequence-diagram" style="grid-template-columns: repeat(6, auto) 1fr">
      <div class="participant" style="grid-column: 1 / 3;grid-row: 1 / 2">Public API</div>
      <div class="participant" style="grid-column: 3 / 5;grid-row: 1 / 2">User Database</div>
      <div class="participant" style="grid-column: 5 / 7;grid-row: 1 / 2">Auth Service</div>

      <div class="action" style="grid-column: -2 / -1;grid-row: 2 / 3">Authenticate</div>
      <div class="action" style="grid-column: -2 / -1;grid-row: 3 / 4">Query user</div>
      <div class="action" style="grid-column: -2 / -1;grid-row: 4 / 5">User data</div>
      <div class="action" style="grid-column: -2 / -1;grid-row: 5 / 6">Token</div>

      <div class="interaction" style="grid-column: 2 / 6;grid-row: 2 / 3">
        <div class="arrow"></div>
      </div>
      <div class="interaction" style="grid-column: 4 / 6;grid-row: 3 / 4">
        <div class="arrow reverse"></div>
      </div>
      <div class="interaction" style="grid-column: 4 / 6;grid-row: 4 / 5">
        <div class="arrow"></div>
      </div>
      <div class="interaction" style="grid-column: 2 / 6;grid-row: 5 / 6">
        <div class="arrow reverse"></div>
      </div>
  </body>

</html>
